name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            id: macos
          - name: Windows x64
            os: windows-latest
            id: windows
          - name: Linux x64
            os: ubuntu-22.04
            id: linux
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            patchelf file libfuse2

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.id == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.id }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: app/ui
        run: pnpm install --frozen-lockfile

      - name: Build desktop app (macOS)
        if: matrix.id == 'macos'
        working-directory: app/ui
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Build desktop app (Windows)
        if: matrix.id == 'windows'
        working-directory: app/ui
        run: pnpm tauri build --bundles nsis

      - name: Build desktop app (Linux)
        if: matrix.id == 'linux'
        working-directory: app/ui
        run: pnpm tauri build --bundles deb,appimage

      - name: Build CLI (macOS)
        if: matrix.id == 'macos'
        run: |
          cargo build --release -p ploom-cli --target aarch64-apple-darwin
          cargo build --release -p ploom-cli --target x86_64-apple-darwin
          mkdir -p dist/cli
          lipo -create -output dist/cli/ploom \
            target/aarch64-apple-darwin/release/ploom \
            target/x86_64-apple-darwin/release/ploom

      - name: Build CLI (Windows, Linux)
        if: matrix.id != 'macos'
        run: cargo build --release -p ploom-cli

      - name: Collect artifacts (macOS)
        if: matrix.id == 'macos'
        run: |
          mkdir -p dist/out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/out/Ploom-macos-universal.dmg
          tar -C dist/cli -czf dist/out/ploom-cli-macos-universal.tar.gz ploom

      - name: Collect artifacts (Windows)
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/out | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist/out/Ploom-windows-x64-setup.exe
          Compress-Archive -Path target/release/ploom.exe -DestinationPath dist/out/ploom-cli-windows-x64.zip

      - name: Collect artifacts (Linux)
        if: matrix.id == 'linux'
        run: |
          mkdir -p dist/out
          cp target/release/bundle/appimage/*.AppImage dist/out/Ploom-linux-x64.AppImage
          cp target/release/bundle/deb/*.deb dist/out/Ploom-linux-x64.deb
          tar -C target/release -czf dist/out/ploom-cli-linux-x64.tar.gz ploom

      - uses: actions/upload-artifact@v4
        with:
          name: ploom-${{ matrix.id }}
          path: dist/out/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --draft \
            --title "Ploom ${GITHUB_REF_NAME}" \
            --generate-notes
